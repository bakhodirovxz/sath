[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ges-sim"
version = "0.1.0"
description = "GES (gidroelektrostansiya) simulyatsiya modellari: suv ombori, turbina, quvur, CFD, monitoring"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ges_sim*"]
