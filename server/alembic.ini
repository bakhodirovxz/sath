# Alembic CLI konfiguratsiyasi (ishlab chiqish uchun). Server startida migratsiya
# ges_server.db.migrate() orqali avtomatik bajariladi (GES_AUTO_MIGRATE=true).
#
#   cd server && alembic revision --autogenerate -m "izoh"
#   cd server && alembic upgrade head
#
# DB manzili GES_DATABASE_URL muhit o'zgaruvchisidan olinadi (env.py).
[alembic]
script_location = ges_server:migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
