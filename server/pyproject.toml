[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ges-server"
version = "0.1.0"
description = "Sath server: modellar, versiyalar, rollar, tasdiqlash, simulyatsiya"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "ifcopenshell>=0.8",
    "trimesh>=4.4",
    "assimp-py>=1.0",
    "ezdxf>=1.3",
    "pycollada>=0.8",
    "ifcdiff>=0.8",
    "defusedxml>=0.7",
    "ges-sim",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]
postgres = ["psycopg[binary]>=3.1"]
mqtt = ["paho-mqtt>=2.0"]
cad = ["cadquery-ocp>=7.7"]  # STEP/IGES/BREP import (OpenCASCADE, ~100 MB)

[project.scripts]
ges-server = "ges_server.main:run"
ges-worker = "ges_server.sim.worker:main"

[tool.setuptools.packages.find]
include = ["ges_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore:The anyio.abc.BlockingPortal alias:DeprecationWarning",
]
