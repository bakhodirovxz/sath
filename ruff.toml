# Butun monorepo uchun yagona Python lint/format sozlamasi
line-length = 100
target-version = "py310"
extend-exclude = ["web", "node_modules", ".venv", "desktop/build/_work"]

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # uzun qatorlar — formatter hal qiladi

[lint.per-file-ignores]
"*/tests/*" = ["E402"]  # test muhiti importdan oldin sozlanadi
