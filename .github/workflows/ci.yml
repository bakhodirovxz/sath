name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --prefix web/tools  # ifc2frag (fragments testi)
      - run: pip install -e "./sim[dev]" -e "./server[dev]"
      - run: python desktop/build/sync_blender.py --check
      - run: ruff check server sim desktop
      - run: pytest -q sim/tests server/tests desktop/tests --junitxml=report.xml
        continue-on-error: true
      - run: python desktop/build/ci_annotate.py report.xml
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile -t sath:ci .
  e2e:
    # To'liq oqim brauzerda: server (web build ni tarqatadi) + Playwright chromium
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -e ./sim -e ./server
      - run: cd web && npm ci && npm run build && cd tools && npm ci --omit=dev
      - run: cd web && npx playwright install --with-deps chromium
      - name: Server (fon)
        run: |
          export GES_DATA_DIR=/tmp/ges-e2e GES_DATABASE_URL=sqlite:////tmp/ges-e2e/ges.db GES_ADMIN_PASSWORD=admin123 GES_SECRET_KEY=e2e-secret-key-that-is-at-least-32-bytes-long GES_CFD_MODE=off
          nohup uvicorn ges_server.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - run: cd web && E2E_BASE_URL=http://localhost:8000 E2E_CHANNEL=chromium npx playwright test
      - if: failure()
        run: cat /tmp/server.log | tail -50
