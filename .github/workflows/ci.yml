name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }  # CODE-04: namuna FBX/3DS/DWG, wheel lar Git LFS da
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: npm ci --prefix web/tools  # ifc2frag (fragments testi)
      # CI-03: versiyalar lok fayldan (constraints); lok pyproject bilan mosligi tekshiriladi
      - run: pip install -c server/requirements.lock -e "./sim[dev]" -e "./server[dev]" pytest-cov
      - run: python desktop/build/gen_lock.py --check
      - run: python desktop/build/sync_blender.py --check
      - run: ruff check server sim desktop
      # CI-01: pytest xatosi ishni yiqitadi (continue-on-error yo'q); annotatsiya har holda (if: always())
      # CI-02: qamrov (coverage) hisoboti — terminal + coverage.xml artefakt
      - run: >-
          pytest -q sim/tests server/tests desktop/tests --junitxml=report.xml
          --cov=ges_server --cov=ges_sim --cov-report=term:skip-covered --cov-report=xml:coverage.xml
      - if: always()
        run: python desktop/build/ci_annotate.py report.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with: { name: coverage, path: coverage.xml, if-no-files-found: ignore, retention-days: 14 }
  audit:
    # CI-02: bog'liqliklar zaifliklari — HISOBOT rejimi (continue-on-error: bloklamaydi, natija logda va
    # annotatsiyada). Bloklovchiga o'tkazish: continue-on-error ni olib tashlang.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - run: pip install pip-audit -e ./sim -e "./server[postgres,mqtt]"
      - name: pip-audit (hisobot)
        continue-on-error: true
        run: pip-audit --skip-editable --progress-spinner off
      - name: npm audit web (hisobot)
        continue-on-error: true
        run: npm audit --prefix web --omit=dev --audit-level=high
      - name: npm audit web/tools (hisobot)
        continue-on-error: true
        run: npm audit --prefix web/tools --omit=dev --audit-level=high
  postgres:
    # Butun server to'plami Postgres + TimescaleDB da (D1): hypertable migratsiyasi, COPY ingest, yuk testi
    runs-on: ubuntu-latest
    services:
      timescale:
        image: timescale/timescaledb:latest-pg16@sha256:f495f2bc25ca7596ca8e1606c6241ca250ccc56a0c082b9f2ec0d290e0126cd9  # CI-03: digest pin
        env: { POSTGRES_DB: ges, POSTGRES_USER: ges, POSTGRES_PASSWORD: ges }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ges" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -c server/requirements.lock -e "./sim[dev]" -e "./server[dev,postgres]"
      - run: pytest -q server/tests -x
        env: { GES_TEST_DATABASE_URL: "postgresql+psycopg://ges:ges@localhost:5432/ges" }
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build  # + login to'plami < 500 KB tekshiruvi
  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile -t sath:ci .
  docker-cfd:
    # CI-02: CFD worker obrazi ham yig'iladi (OpenFOAM + ges-worker) — Dockerfile.cfd buzilsa CI da ko'rinadi
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile.cfd -t sath-cfd:ci .
      - run: docker run --rm --entrypoint /venv/bin/python sath-cfd:ci -c "import ges_server.sim.worker, ges_sim.cfd; print('ok')"
  e2e:
    # To'liq oqim brauzerda: server (web build ni tarqatadi) + Playwright chromium
    runs-on: ubuntu-latest
    needs: [server, web]
    # Admin paroli bitta joyda: server seed va Playwright (e2e/creds.ts — CI da E2E_PASS majburiy)
    env: { E2E_PASS: Sath-e2e-Ci-pw-2026 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install -c server/requirements.lock -e ./sim -e ./server
      - run: cd web && npm ci && npm run build && cd tools && npm ci --omit=dev
      - run: cd web && npx playwright install --with-deps chromium
      - name: Server (fon)
        run: |
          export GES_DATA_DIR=/tmp/ges-e2e GES_DATABASE_URL=sqlite:////tmp/ges-e2e/ges.db GES_ADMIN_PASSWORD="$E2E_PASS" GES_DEV_MODE=true GES_SECRET_KEY=e2e-secret-key-that-is-at-least-32-bytes-long GES_CFD_MODE=off GES_RATE_LOGIN_PER_MIN=600
          nohup uvicorn ges_server.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
      - run: cd web && E2E_BASE_URL=http://localhost:8000 E2E_CHANNEL=chromium npx playwright test
      - if: failure()
        run: cat /tmp/server.log | tail -50
  desktop-blender:
    # K7: Blender addoni headless testlari — Blender 5.2.2 + Bonsai 0.9.0 (sha256 pin), FreeCAD siz
    # (3 ta FreeCAD testi [SKIP]: engine, objects, demo_plant; P2 da FreeCAD siz builder lar bilan almashadi). Server talab qiladigan
    # testlar (GES_TEST_SERVER) bu yerda ishlamaydi.
    runs-on: windows-2022
    needs: [server]
    steps:
      - uses: actions/checkout@v7
        with: { lfs: true }  # addon wheel lari LFS da
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/cache@v6
        with:
          path: |
            ~/Tools/blender-5.2.2-windows-x64.zip
            ~/Tools/bonsai-0.9.0-py313-win64.zip
          key: blender-5.2.2-bonsai-0.9.0-v1
      - run: python desktop/build/ci_blender_setup.py
      - run: python desktop/build/sync_blender.py --check
      - name: Headless testlar
        shell: pwsh
        run: ./desktop/tests/run_blender_tests.ps1
      - name: Addon zip
        shell: pwsh
        run: python desktop/build/build_blender_addon.py --blender $env:GES_BLENDER
      - uses: actions/upload-artifact@v7
        with: { name: sath-addon, path: desktop/dist/sath-*.zip, retention-days: 14 }
