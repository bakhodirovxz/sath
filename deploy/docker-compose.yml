# Sath — kompaniya ichki server.
#   cp .env.example .env   (parollarni o'zgartiring)
#   docker compose up -d --build
# Brauzer: https://<GES_DOMAIN> (--profile https). 8000 port default faqat shu hostda (127.0.0.1, OPS-01) —
#   Caddy siz tarmoqqa ochish kerak bo'lsa (faqat sinov/ichki): .env da GES_BIND=0.0.0.0
#
# Default: Postgres + TimescaleDB (historian uchun; D1). SQLite faqat ishlab chiqish/sinov uchun —
#   .env da GES_DATABASE_URL=sqlite:////data/ges.db bersangiz postgres servisi kerak emas.
# CFD (OpenFOAM) kerak bo'lsa: docker compose --profile cfd up -d  (ges servisida GES_CFD_MODE=worker)
# HTTPS kerak bo'lsa: docker compose --profile https up -d  (Caddy: GES_DOMAIN uchun avtomatik sertifikat,
#   ichki tarmoqda o'z sertifikati — Caddyfile ga qarang); u holda GES_PUBLIC_URL=https://<domen> va
#   .env da GES_BIND=127.0.0.1 — to'g'ridan-to'g'ri 8000 port faqat shu hostdan (TLS chegarasi aylanib o'tilmaydi, L1)
#
# Loyiha nomi qat'iy `sath` (SEC-02): hajmlar sath_ges_data, sath_pg_data, ... — backup.sh/restore.sh shu
# nomlarni kutadi (papka nomi `deploy` bo'lsa ham deploy_ges_data emas).
name: sath
services:
  ges:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sath:latest
    restart: unless-stopped
    ports:
      - "${GES_BIND:-127.0.0.1}:${GES_PORT:-8000}:8000"
    env_file: .env
    environment:
      # .env dagi GES_DATABASE_URL ustun; berilmasa — compose dagi Postgres
      GES_DATABASE_URL: ${GES_DATABASE_URL:-postgresql+psycopg://ges:${POSTGRES_PASSWORD:-ges}@postgres:5432/ges}
      # Caddy ortida klient IP X-Forwarded-For dan (tezlik cheklovi uchun); to'g'ridan-to'g'ri ochiq bo'lsa false
      GES_RATE_TRUST_FORWARDED: ${GES_RATE_TRUST_FORWARDED:-false}
    volumes:
      - ges_data:/data
      # CFD case papkalari alohida hajmda — cfd worker faqat shuni ko'radi (secret.key, IFC fayllar emas)
      - cfd_data:/data/cfd
    # Qattiqlashtirish (L5): imtiyozsiz, faqat o'qiladigan ildiz FS (/data va /tmp yoziladi), PID/xotira chegarasi
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # bwrap sandbox (konverterlar tarmoqsiz, alohida nom maydonida) Docker default seccomp bilan ishlamaydi
    # (rlimit rejimiga tushadi). Qattiqroq izolyatsiya kerak bo'lsa: seccomp ni o'chirib bwrap ni yoqing:
    # security_opt: [no-new-privileges:true, seccomp=unconfined]
    read_only: true
    tmpfs: ["/tmp:size=2g", "/home/sath:size=64m"]
    pids_limit: 512
    mem_limit: "${GES_MEM_LIMIT:-6g}"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  postgres:
    # TimescaleDB (PG16): readings hypertable (7 kunlik bo'laklar) — migratsiya 0014 avtomatik
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ges
      POSTGRES_USER: ges
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ges}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ges"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      GES_DOMAIN: ${GES_DOMAIN:-ges-server}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [ges]

  cfd:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.cfd
    image: sath-cfd:latest
    profiles: ["cfd"]
    restart: unless-stopped
    # .env to'liq berilmaydi (SEC-01): worker ga faqat DB manzili kerak — JWT kaliti, admin/SMTP/MQTT
    # parollari OpenFOAM konteyneriga tushmaydi. DB — server bilan AYNAN bir xil (default Postgres).
    environment:
      GES_DATABASE_URL: ${GES_DATABASE_URL:-postgresql+psycopg://ges:${POSTGRES_PASSWORD:-ges}@postgres:5432/ges}
      GES_CFD_MODE: local
      GES_SECRET_KEY_REQUIRED: "false"
      GES_CFD_TIMEOUT_S: ${GES_CFD_TIMEOUT_S:-10800}
    # Faqat case papkalari (ges servisi bilan umumiy) — butun /data (secret.key, ges.db, fayllar) emas
    volumes:
      - cfd_data:/data/cfd
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    cpus: "${CFD_CPUS:-4}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    mem_limit: "${CFD_MEM_LIMIT:-8g}"

  # Sinov stendi (E4): GES simulyatori Modbus/OPC UA server sifatida + unga ulangan gateway.
  # docker compose --profile sim up -d ; stsenariy: SIM_SCENARIO (normal|unit_trip|flood|comms_loss|...)
  # Gateway kalitlari: GES_GATEWAY_INGEST_KEY / GES_GATEWAY_COMMAND_KEY (.env) — Monitoring → Ulanish kalitlari
  simulator:
    build:
      context: ..
      dockerfile: deploy/simulator/Dockerfile
    image: sath-simulator:latest
    profiles: ["sim"]
    restart: unless-stopped
    command: ["python", "ges_simulator.py", "--scenario", "${SIM_SCENARIO:-normal}", "--modbus", "0.0.0.0:5020", "--opcua", "opc.tcp://0.0.0.0:4840/sath-sim/", "--speed", "${SIM_SPEED:-1}"]
    ports: ["5020:5020", "4840:4840"]

  sim-gateway:
    image: sath-simulator:latest
    profiles: ["sim"]
    restart: unless-stopped
    depends_on: [simulator, ges]
    environment:
      GES_GATEWAY_SERVER: http://ges:8000
      GES_GATEWAY_PROJECT_ID: "${SIM_PROJECT_ID:-1}"
      GES_GATEWAY_INGEST_KEY: "${GES_GATEWAY_INGEST_KEY:-}"
      GES_GATEWAY_COMMAND_KEY: "${GES_GATEWAY_COMMAND_KEY:-}"
      GES_GATEWAY_COMMANDS: "${GES_GATEWAY_COMMANDS:-false}"
    command: ["sh", "-c", "python ges_simulator.py --print-gateway-config --modbus simulator:5020 --opcua opc.tcp://simulator:4840/sath-sim/ > /tmp/gw.json && python ges_gateway.py /tmp/gw.json"]

volumes:
  ges_data:
  cfd_data:
  pg_data:
  caddy_data:
  caddy_config:
